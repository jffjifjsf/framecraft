name: iOS 无签名 IPA

# 产出可自签的 .ipa：不签名、不导出、不需要证书和账号。
# 结构是标准的 Payload/FrameCraft.app，签名工具（轻松签 / 全能签 / Sideloadly / TrollStore）直接能签。
#
# 每次 push 到 main 自动跑一次；也可以在 Actions 页面手动 Run workflow。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: write

jobs:
  ipa:
    name: 编译并打包未签名 IPA
    # 用 Intel 池：编译目标是 arm64 真机包，跑在 x86_64 主机上只是交叉编译，
    # 产物完全一样。而 arm64 池在晚间经常排队 10 分钟以上甚至被取消
    runs-on: macos-15-intel
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: 显示工具链
        run: |
          xcodebuild -version
          sw_vers

      # ---------- 1. 只编译，完全不碰签名 ----------
      - name: 编译（Release, arm64 真机）
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project FrameCraft.xcodeproj \
            -scheme FrameCraft \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/build.log

      # ---------- 2. 打成 Payload/xxx.app 的 zip，后缀改成 .ipa ----------
      - name: 打包 IPA
        run: |
          set -euo pipefail
          APP_DIR="build/DerivedData/Build/Products/Release-iphoneos"
          APP=$(find "$APP_DIR" -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::没找到 .app，看上面的编译日志"
            exit 1
          fi
          echo "APP = $APP"

          rm -rf build/Payload build/out
          mkdir -p build/Payload build/out
          cp -R "$APP" build/Payload/
          APPNAME=$(basename "$APP" .app)
          echo "APP_NAME=$APPNAME" >> "$GITHUB_ENV"
          cp build/Payload/"$APPNAME.app"/Info.plist build/out/Info.plist 2>/dev/null || true

          cd build
          # -y 保留符号链接，否则 .app 里的 framework 链接会断
          zip -qry "out/${APPNAME}-unsigned.ipa" Payload

          echo "=== 产物 ==="
          ls -lh "out/${APPNAME}-unsigned.ipa"
          echo
          echo "=== 内部结构（前 14 行）==="
          unzip -l "out/${APPNAME}-unsigned.ipa" | head -14

      # ---------- 3. 交付前的自检：这三点不对，签名工具会拒 ----------
      - name: 自检
        if: success()
        run: |
          set -uo pipefail
          APP="build/Payload/$APP_NAME.app"
          BIN="$APP/$APP_NAME"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          MINSDK=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" 2>/dev/null || echo "-")
          ARCHS=$(lipo -archs "$BIN" 2>/dev/null || echo "?")
          {
            echo "### 打包结果"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 可执行文件 | \`$APP_NAME\` |"
            echo "| Bundle ID | \`$BUNDLE_ID\` |"
            echo "| 版本 | $VER |"
            echo "| 最低系统 | $MINSDK |"
            echo "| 架构 | $ARCHS |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          if [ ! -f "$BIN" ]; then echo "::error::缺少可执行文件 $BIN"; fail=1; fi
          if codesign -dv "$APP" >/dev/null 2>&1; then
            echo "::warning::这个 .app 仍带签名，部分工具会拒绝二次签"
            echo "仍带签名（部分工具会拒绝二次签）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未签名 ✓ 符合预期" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$ARCHS" != "arm64" ]; then
            echo "::error::架构是 '$ARCHS'，真机需要 arm64"
            fail=1
          fi
          exit $fail

      # ---------- 4. 传到 Release：artifacts 下载要登录，Release 资源不用 ----------
      - name: 发布到 Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="unsigned-ipa-latest"
          IPA=$(ls build/out/*.ipa | head -1)
          # 不要 cp 到同名路径：产物本身就叫 FrameCraft-unsigned.ipa，
          # cp 会报 "same file" 并以非零退出码让整步失败
          IPA_NAME=$(basename "$IPA")
          echo "上传 $IPA_NAME"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "未签名 IPA（自动构建）" \
              --notes "每次 push 到 main 自动覆盖更新。这个 IPA 不含签名，用你自己的证书签一次即可安装。"
          fi
          gh release upload "$TAG" "$IPA" --clobber

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA_NAME}"
          {
            echo
            echo "**下载（无需登录）**：$URL"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "已发布: $URL"

      # ---------- 5. 失败时给出可读的错误行 ----------
      - name: 汇总错误
        if: failure()
        run: |
          {
            echo "### 失败"
            echo
            echo '```'
            grep -E "error:|BUILD FAILED|No such file|not found" build/build.log 2>/dev/null \
              | sed -E 's|^/Users/runner/work/[^/]+/[^/]+/||' | sort -u | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 IPA
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: FrameCraft-unsigned-ipa
          path: |
            build/out/*.ipa
            build/out/Info.plist
          if-no-files-found: warn
          retention-days: 30
